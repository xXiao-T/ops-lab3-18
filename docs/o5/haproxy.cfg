global
    maxconn 4096

defaults
    mode http
    timeout connect 1s
    timeout client 2s
    timeout server 2s
    timeout check 500ms

frontend fe
    bind 127.0.0.1:8080
    default_backend be

backend be
    option httpchk GET /readyz
    http-check expect status 200
    server s1 127.0.0.1:8101 check inter 1s fall 3 rise 2
    server s2 127.0.0.1:8102 check inter 1s fall 3 rise 2
    server s3 127.0.0.1:8103 check inter 1s fall 3 rise 2

listen stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /stats
    stats refresh 1s
